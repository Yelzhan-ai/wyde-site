<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d0c0a'/%3E%3Cpath fill='%23ff4f1a' d='M7 19h9l5 17 5-17h12l5 17 5-17h9L47 46h-8l-7-18-7 18h-8z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ================= ПАЛИТРА И ШРИФТЫ ================= */
:root{
  --ink:#0d0c0a; --ink2:#16140f; --ink3:#211e18; --line:#322d25; --edge:#4d463b;
  --sand:#e8dcc6; --sand2:#cdbb99; --paper:#f4ecdc; --mute:#a0957f;
  --hot:#ff4f1a; --hot2:#ff7445; --hot-l:#d63a0c; --hot-d:#b02e06;
  --fh:'Oswald','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  --fb:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--ink);color:var(--sand);font:400 17px/1.55 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:hidden}
svg,canvas,img{max-width:100%;display:block}
h1,h2,h3,p,ul,ol,dl,dd,fieldset,legend{margin:0;padding:0}
fieldset{border:0;min-width:0} ul,ol{list-style:none}
a{color:inherit} button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--hot);outline-offset:3px}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:760px}

/* ================= ШАПКА ================= */
.top{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(13,12,10,.84);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
.logo{height:19px;width:auto;color:var(--sand)}
.lang{display:flex;border:1px solid var(--edge);border-radius:999px;padding:3px}
.lang button{background:none;border:0;min-width:46px;height:38px;border-radius:999px;font:800 13px/1 var(--fb);letter-spacing:.06em;color:var(--mute);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--sand);color:var(--ink)}

/* ================= ОБЩЕЕ ================= */
section{padding:76px 0;position:relative}
.kicker{display:flex;align-items:center;gap:10px;font:800 12px/1.2 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--hot);margin-bottom:16px}
.kicker::before{content:"";flex:none;width:28px;height:3px;background:currentColor}
h1,h2,h3{overflow-wrap:anywhere}
h2{font:700 clamp(38px,10.6vw,84px)/1 var(--fh);text-transform:uppercase;margin-bottom:18px}
.lead{font-size:clamp(17px,4.5vw,21px);max-width:36em}
.muted{color:var(--mute)} .small{font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:14px 24px;border-radius:12px;border:2px solid var(--hot);background:var(--hot);color:var(--ink);font:700 17px/1.1 var(--fh);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;text-align:center;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:var(--hot2);border-color:var(--hot2)} .btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--sand);border-color:var(--sand)}
.btn.ghost:hover{background:rgba(232,220,198,.1)}
.btn[disabled]{opacity:.6;cursor:wait}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:26px}
.hero .btns{margin-top:20px}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:22px;padding:22px}
.btn.next{width:100%;min-height:62px;font-size:19px}
.stepno{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.stepno b{font:700 26px/1 var(--fh);text-transform:uppercase;letter-spacing:.03em;color:var(--hot);white-space:nowrap}
.stepno .bar{display:flex;gap:6px;flex:1;max-width:170px}
.stepno .bar i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.stepno .bar i.on{background:var(--hot)}
.mcard{max-width:760px;margin-top:30px}
.mcard .btn.next{margin-top:24px}
#quizNext{margin-top:28px}
.sand{background:var(--sand);color:var(--ink)}
.sand .kicker{color:var(--hot-d)} .sand .btn.ghost{color:var(--ink);border-color:var(--ink)}
.alt{background:var(--ink2)} .alt .card{background:var(--ink)}
.js .rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.js .rv.in{opacity:1;transform:none}

/* ================= ПЕРВЫЙ ЭКРАН ================= */
.hero{min-height:100vh;min-height:100svh;display:flex;align-items:flex-end;padding:76px 0 40px;overflow:hidden}
.hero-bg{position:absolute;right:-30%;top:40px;width:min(118vw,760px);color:var(--sand);opacity:.13;transform:rotate(14deg);pointer-events:none}
.hero .wrap{position:relative}
.eyebrow{font:800 11.5px/1.3 var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
h1{font:700 clamp(42px,12.4vw,124px)/.96 var(--fh);text-transform:uppercase;letter-spacing:-.005em}
h1 span{display:block} h1 .hot{color:var(--hot)}
.wline{display:flex;align-items:center;margin:14px 0 12px;color:var(--hot);transform-origin:center;animation:widen 1.5s .25s cubic-bezier(.2,.8,.2,1) both}
.wline i{flex:1;height:3px;background:currentColor}
.wline::before,.wline::after{content:"";border:8px solid transparent}
.wline::before{border-right-color:currentColor;margin-right:-1px} .wline::after{border-left-color:currentColor;margin-left:-1px}
@keyframes widen{from{transform:scaleX(.18);opacity:0}to{transform:scaleX(1);opacity:1}}
.points{display:grid;gap:10px;margin-top:30px;padding-top:22px;border-top:1px solid var(--line);font:600 16px/1.35 var(--fb);color:var(--sand2)}
.points li{display:flex;gap:10px} .points li::before{content:"↔";color:var(--hot);flex:none}
.mq{overflow:hidden;border-block:1px solid var(--line);padding:15px 0;font:700 clamp(22px,6vw,40px)/1 var(--fh);text-transform:uppercase;white-space:nowrap}
.mq div{display:inline-block;animation:mq 30s linear infinite} .mq span{margin:0 .55em} .mq b{color:var(--hot)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ================= ТЕСТ СТЕЛЬКИ ================= */
.test-grid{display:grid;gap:26px;margin-top:30px}
.tsvg{width:min(62vw,250px);margin:0 auto}
.tsvg .ins{fill:var(--ink3);stroke:var(--sand2);stroke-width:2.5;stroke-dasharray:7 6}
.tsvg .ft{fill:rgba(232,220,198,.2);stroke:var(--sand);stroke-width:2.5}
.tsvg .over{fill:var(--hot);stroke:var(--hot);stroke-width:2.5}
#footG *{vector-effect:non-scaling-stroke}
.footA{transform-box:view-box;transform-origin:100px 240px;animation:spread 5s ease-in-out infinite}
@keyframes spread{0%,10%{transform:scaleX(.78)}42%,82%{transform:scaleX(var(--s,1))}100%{transform:scaleX(.78)}}
.tsvg.set .footA{animation:none;transform:scaleX(var(--s,1));transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.tkey{display:flex;justify-content:center;gap:18px;margin-top:12px;font:600 13px var(--fb);color:var(--mute)}
.tkey i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.nsteps{display:grid;gap:12px;counter-reset:n;margin-bottom:22px}
.nsteps li{display:flex;gap:12px;align-items:flex-start}
.nsteps li::before{counter-increment:n;content:counter(n);flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--hot);color:var(--hot);font:800 14px/27px var(--fb);text-align:center}
.res{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.res-h{font:700 clamp(26px,7.4vw,40px)/1.02 var(--fh);text-transform:uppercase}
.res-h b{display:block;font-size:clamp(84px,29vw,190px);line-height:.86;color:var(--hot);margin:.06em 0 .08em;white-space:nowrap}
.punch{font:700 clamp(24px,6.8vw,38px)/1.05 var(--fh);text-transform:uppercase;margin:16px 0 14px}
.punch em{font-style:normal;color:var(--hot);display:block}
.note-ok{display:inline-block;margin-top:14px;font:600 15px/1.3 var(--fb);color:var(--sand2);border:1px dashed var(--edge);border-radius:10px;padding:8px 12px}
.hint{margin-top:22px;padding:16px 18px;border-left:3px solid var(--hot);background:var(--ink3);border-radius:0 14px 14px 0;font-size:17px}

/* ================= ПОЛЯ ================= */
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>label,.flabel{font:600 16px/1.3 var(--fb);color:var(--sand)}
.flabel small,.field label small{font-weight:400;color:var(--mute)}
.inp{width:100%;min-height:54px;padding:12px 14px;background:var(--ink);border:1.5px solid var(--edge);border-radius:12px;font-size:17px;color:var(--sand)}
.alt .inp{background:var(--ink2)}
.inp::placeholder{color:#8b8272;opacity:1}
.inp:focus{outline:none;border-color:var(--hot);box-shadow:0 0 0 3px rgba(255,79,26,.28)}
.inp[readonly]{border-style:dashed;color:var(--sand2);text-overflow:ellipsis}
.inp[readonly]::placeholder{font-size:14.5px}
textarea.inp{min-height:112px;resize:vertical;line-height:1.4}
.bad .inp,.bad .chip span{border-color:#ff7a6b}
.err{font:600 15px/1.3 var(--fb);color:#ffa698}
.tlink{display:block;width:fit-content;margin:6px auto 0;padding:12px 4px;font:600 16px/1.35 var(--fb);color:var(--sand2);text-align:center;text-decoration:underline;text-underline-offset:4px}
.tlink:hover{color:var(--hot)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:end}
.stack{display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;max-width:100%}
.chip input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.chip span{display:flex;align-items:center;min-height:48px;padding:10px 17px;border:1.5px solid var(--edge);border-radius:999px;font:600 16px/1.2 var(--fb);transition:background .15s,color .15s,border-color .15s}
.chip input:checked+span{background:var(--sand);color:var(--ink);border-color:var(--sand)}
.chip input:focus-visible+span{outline:3px solid var(--hot);outline-offset:2px}

/* ================= МАНИФЕСТ ================= */
.manifest{padding:92px 0}
.manifest p:not(.kicker){font:700 clamp(30px,8.4vw,70px)/1.04 var(--fh);text-transform:uppercase;margin-bottom:.6em;overflow-wrap:anywhere}
.manifest p.dim{color:#5a5244}
.manifest p.big{font-size:clamp(56px,17vw,156px);line-height:.95;margin:.3em 0 .35em}
.manifest p.fin{color:var(--hot-l);margin-bottom:0}
.manifest s{text-decoration:line-through;text-decoration-color:var(--hot-l);text-decoration-thickness:.11em}

/* ================= КВИЗ ================= */
.prog{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin:12px 0 22px}
.prog i{display:block;height:100%;width:25%;background:var(--hot);border-radius:5px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;font:800 12px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.linkbtn{background:none;border:0;padding:10px 0;font:700 16px var(--fb);color:var(--sand2);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.qtitle{font:700 clamp(30px,8.4vw,48px)/1 var(--fh);text-transform:uppercase}
.opts{display:grid;gap:12px;margin-top:20px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px 12px 12px;min-height:96px;background:var(--ink);border:1.5px solid var(--edge);border-radius:18px;cursor:pointer;transition:border-color .15s,transform .15s,background .15s}
.opt:hover,.opt:focus-visible{border-color:var(--hot);transform:translateX(4px)}
.opt:active{background:var(--ink3)}
.opt svg{flex:none;width:72px;height:72px}
.opt b{display:block;font:700 21px/1.08 var(--fh);text-transform:uppercase;letter-spacing:.02em}
.opt small{display:block;margin-top:4px;font-size:15px;line-height:1.3;color:var(--mute)}
.qi .a{fill:rgba(232,220,198,.14);stroke:var(--sand);stroke-width:2}
.qi .h{fill:var(--hot);stroke:var(--hot);stroke-width:2}
.qi .l{fill:none;stroke:var(--hot);stroke-width:3.5;stroke-linecap:round}
.qi .g{fill:none;stroke:var(--edge);stroke-width:2;stroke-linecap:round}
.fadein{animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tname{display:flex;flex-direction:column;font:700 clamp(46px,13.6vw,108px)/1 var(--fh);text-transform:uppercase;color:var(--hot);margin:6px 0 12px}
.tcard{border-top:1px solid var(--line);padding:22px 0 4px}
.tcard h3{font:700 28px/1 var(--fh);text-transform:uppercase;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.tcard h3 small{font:600 14px/1.2 var(--fb);text-transform:none;color:var(--mute)}
.tcard dt{font:800 11.5px/1.2 var(--fb);letter-spacing:.15em;text-transform:uppercase;color:var(--hot);margin-top:16px}
.tcard dd{margin-top:6px}
.toenote{margin-top:6px;padding:14px 16px;border-radius:14px;background:var(--ink3);font-size:17px}
.storybox{margin-top:28px;display:grid;gap:20px;align-items:center}
.storybox img{width:min(62vw,250px);height:auto;border-radius:18px;border:1px solid var(--line);margin:0 auto;background:var(--ink)}
.storybox h3{font:700 clamp(28px,7.6vw,40px)/1 var(--fh);text-transform:uppercase;margin-bottom:10px}

/* ================= ДЛИНА ≠ ШИРИНА ≠ ОБЪЁМ ================= */
.dia{display:grid;grid-template-columns:.8fr 1.2fr;gap:10px;align-items:end;margin:30px 0 8px}
.dia svg{width:100%;height:auto}
.dia .f{fill:rgba(232,220,198,.1);stroke:var(--sand);stroke-width:2;stroke-linejoin:round}
.dia .d{fill:none;stroke:var(--hot);stroke-width:2;stroke-linecap:round}
.dia .gr{fill:none;stroke:var(--edge);stroke-width:2}
.mk circle{fill:var(--hot)} .mk text{font:800 13px var(--fb);fill:var(--ink);text-anchor:middle}
.legend li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:17px}
.legend li::before{content:attr(data-n);flex:none;width:26px;height:26px;border-radius:50%;background:var(--hot);color:var(--ink);font:800 13px/26px var(--fb);text-align:center}
.h3{font:700 clamp(26px,7vw,38px)/1.02 var(--fh);text-transform:uppercase;margin-bottom:12px}
.cols{display:grid;gap:22px;margin-top:34px}
.facts{display:grid;gap:12px;margin-top:6px}
.facts li{padding:16px 18px;border-radius:16px;background:var(--ink);border:1px solid var(--line);font-size:17px}
.src{display:inline-block;margin-top:14px;font:600 13.5px/1.4 var(--fb);color:var(--sand2);text-underline-offset:4px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:18px}
.scale span{padding:9px 0;text-align:center;border:1px solid var(--line);border-radius:8px;font:700 13px/1 var(--fh);color:var(--mute);transition:.3s}
.scale span.on{background:var(--hot);border-color:var(--hot);color:var(--ink);transform:scale(1.14)}
.jis-out{font:700 clamp(26px,7vw,36px)/1.05 var(--fh);text-transform:uppercase;margin-top:20px}
.jis-out b{color:var(--hot);font-size:1.5em}

/* ================= КАК ИЗМЕРИТЬ ================= */
.steps{display:grid;gap:14px;margin-top:30px;counter-reset:s}
.step{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:start;background:var(--paper);color:var(--ink);border-radius:18px;padding:18px}
.step svg{width:62px;height:62px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.step svg .o{stroke:var(--hot-l)} .step svg text{font:800 11px var(--fb);fill:var(--ink);stroke:none}
.step h3{font:700 22px/1.08 var(--fh);text-transform:uppercase;margin-bottom:6px}
.step h3::before{counter-increment:s;content:counter(s,decimal-leading-zero) " ";color:var(--hot-d)}
.step p{font-size:17px;line-height:1.45}

/* ================= АНКЕТА ================= */
.form fieldset{padding:26px 0 0;margin-top:26px;border-top:1px solid var(--line)}
.form legend{float:left;width:100%;font:700 26px/1 var(--fh);text-transform:uppercase;margin-bottom:18px}
.form legend+*{clear:both}
.consent{display:flex;gap:12px;align-items:flex-start;margin-top:28px;font-size:17px;line-height:1.4}
.consent input{flex:none;width:26px;height:26px;margin:0;accent-color:var(--hot)}
.form .btn{width:100%;margin-top:22px;min-height:62px;font-size:19px}
.fmsg{margin-top:14px;font:600 16px/1.4 var(--fb);color:#ffa698}
.okbox{text-align:center;padding:34px 8px}
.okbox svg{width:84px;height:84px;margin:0 auto 20px;color:var(--hot)}
.okbox h3{font:700 clamp(36px,10vw,64px)/.96 var(--fh);text-transform:uppercase;margin-bottom:14px}
.okbox .btn{margin-top:24px}
.demo{margin-top:18px;font-size:13px;color:var(--mute)}

/* ================= ИСТОРИЯ / FAQ / ФУТЕР ================= */
.fgrid{display:grid;gap:28px;margin-top:8px}
.photo{aspect-ratio:4/5;max-height:440px;width:100%;border-radius:22px;border:1.5px dashed var(--edge);background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(232,220,198,.045) 14px 28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mute);font:800 12px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase}
.photo svg{width:46%;color:var(--edge)}
.fgrid figure{margin:0;min-width:0}
.fgrid figcaption{margin-top:12px;font:600 14.5px/1.4 var(--fb);color:var(--sand2)}
#foText p{font:500 clamp(23px,6.2vw,34px)/1.2 var(--fh);margin-bottom:.75em}
#foText p:last-child{color:var(--hot);font-weight:700;text-transform:uppercase}
.sign{font:600 14px var(--fb);color:var(--mute)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px}
.nums li{border-top:3px solid var(--hot);padding-top:10px;font:600 13px/1.25 var(--fb);color:var(--mute)}
.nums b{display:block;font:700 clamp(28px,8vw,44px)/1 var(--fh);color:var(--sand)}
.nums li:last-child b{color:var(--hot)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;font:700 clamp(21px,5.6vw,27px)/1.12 var(--fh);text-transform:uppercase}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";flex:none;font:400 32px/1 var(--fb);color:var(--hot);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 0 22px;max-width:40em}
footer{border-top:1px solid var(--line);padding:44px 0 110px}
footer .logo{height:26px;margin-bottom:14px}
.soc{display:flex;gap:10px;margin:22px 0 0}
.soc a{display:grid;place-items:center;width:50px;height:50px;border-radius:50%;border:1.5px solid var(--edge);transition:.15s}
.soc a:hover{background:var(--sand);color:var(--ink);border-color:var(--sand)}
.soc svg{width:22px;height:22px;fill:currentColor}
.copy{margin-top:24px;font-size:13.5px;color:var(--mute)}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;width:60px;height:60px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.wa svg{width:32px;height:32px;fill:currentColor}
dialog{border:1px solid var(--line);padding:0;background:var(--ink2);color:var(--sand);border-radius:22px;width:min(560px,calc(100vw - 28px));max-height:86vh}
dialog::backdrop{background:rgba(0,0,0,.72)}
.dlg{padding:24px}
.dlg h3{font:700 28px/1.02 var(--fh);text-transform:uppercase;margin-bottom:14px}
.dlg li{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;line-height:1.45}
.dlg li b{color:var(--hot);font-weight:800}
.dlg .btn{width:100%;margin-top:20px}
.toast{position:fixed;left:50%;bottom:92px;z-index:60;transform:translate(-50%,20px);background:var(--sand);color:var(--ink);font:800 14px/1.2 var(--fb);padding:13px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ================= ШИРОКИЕ ЭКРАНЫ ================= */
@media(min-width:600px){
  .btns{flex-direction:row;flex-wrap:wrap}
  .btn.next{max-width:560px}
  .points{grid-template-columns:repeat(3,1fr);gap:20px}
  .opts{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
  .opt{flex-direction:column;text-align:center;padding:22px 14px}
  .opt:hover,.opt:focus-visible{transform:translateY(-4px)}
  .opt svg{width:116px;height:116px}
  .storybox{grid-template-columns:auto 1fr;gap:34px}
  .steps{grid-template-columns:1fr 1fr}
  .card{padding:34px}
  .form .g2w{grid-template-columns:1fr 1fr}
}
@media(min-width:880px){
  section{padding:110px 0}
  .test-grid{grid-template-columns:300px 1fr;align-items:start;gap:50px}
  .cols{grid-template-columns:1fr 1fr;gap:40px}
  .steps{grid-template-columns:repeat(3,1fr)}
  .fgrid{grid-template-columns:.75fr 1.25fr;gap:56px;align-items:start}
  .dia{max-width:620px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto} .js .rv{opacity:1;transform:none}
}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<noscript><p style="padding:84px 20px 0;font:600 15px sans-serif;color:#e8dcc6">Чтобы работали тест и анкета, включи JavaScript. · Тест пен сауалнама жұмыс істеуі үшін JavaScript-ті қос. · Please enable JavaScript to use the test and the form.</p></noscript>

<!-- ===== SVG-заготовки: логотип WYDE и силуэт стопы (используются по всему сайту и на картинке для сторис) ===== -->

<header class="top">
  <div class="wrap">
    <a href="#top" aria-label="WYDE"><svg class="logo" viewBox="0 0 576 100" role="img" aria-label="WYDE"><use href="#wyde"/></svg></a>

  </div>
</header>

<main id="top">

<!-- ===== 1. ПЕРВЫЙ ЭКРАН ===== -->
<!-- Варианты заголовка (стоит №1; чтобы поменять — правь h1a / h1b в объекте переводов T):
     1) Широкая обувь начинается со стельки.
     2) Обувь, в которой широкая сама стелька.
     3) Ширина — это не буква на коробке. -->
<section class="hero">
  <svg class="hero-bg" viewBox="0 0 200 430" aria-hidden="true"><use href="#footG" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  <div class="wrap">
    <p class="eyebrow" data-i18n="heroEyebrow">Обувь для широкой стопы · Казахстан</p>
    <h1><span data-i18n="h1a">Широкая обувь</span><span class="hot" data-i18n="h1b">начинается со стельки.</span></h1>
    <div class="wline" aria-hidden="true"><i></i></div>
    <p class="lead" data-i18n="heroSub"></p>
    <div class="btns">
      <a class="btn next" href="#measure" data-i18n="heroBtn">Измерить свою стопу</a>
    </div>
    <p class="muted small" style="margin-top:18px;max-width:34em" data-i18n="heroNote">Готовых пар пока нет: мы строим их по реальным меркам первой тысячи. Возможно, по твоим.</p>
    <ul class="points" data-list="pts"></ul>
  </div>
</section>

<div class="mq" aria-hidden="true"><div id="mq"></div></div>

<!-- ===== 2. МАНИФЕСТ ===== -->
<section class="manifest sand" id="manifest">
  <div class="wrap">
    <p class="kicker rv" data-i18n="mK"></p>
    <p class="dim rv" data-i18n="m1"></p>
    <p class="dim rv" data-i18n-html="m2"></p>
    <p class="dim rv" data-i18n="m3"></p>
    <p class="big rv" data-i18n="m4"></p>
    <p class="rv" data-i18n="m5"></p>
    <p class="fin rv" data-i18n="m6"></p>
    <div class="btns rv" style="margin-top:36px"><a class="btn next" href="#measure" data-i18n="mBtn"></a></div>
  </div>
</section>

<!-- ===== 3. ШАГ 1 — КАК ИЗМЕРИТЬ СТОПУ + ВВОД МЕРОК ===== -->
<section id="measure">
  <div class="wrap">
    <div class="stepno rv" data-step="1"><b></b><span class="bar" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></span></div>
    <p class="kicker rv" data-i18n="meK"></p>
    <h2 class="rv" data-i18n="meH"></h2>
    <p class="lead rv" data-i18n="meLead"></p>
    <ol class="steps" id="steps"></ol>
    <div class="card mcard rv">
      <h3 class="h3" data-i18n="mInH"></h3>
      <form id="mForm" novalidate>
        <div class="stack" style="margin-top:16px">
          <div class="g2">
            <div class="field"><label for="m-lenL" data-i18n="lenL"></label><input class="inp" id="m-lenL" name="m-lenL" data-m="lenL" inputmode="decimal" autocomplete="off" data-req data-num="15,35"></div>
            <div class="field"><label for="m-lenR" data-i18n="lenR"></label><input class="inp" id="m-lenR" name="m-lenR" data-m="lenR" inputmode="decimal" autocomplete="off" data-req data-num="15,35"></div>
          </div>
          <div class="g2">
            <div class="field"><label for="m-ball" data-i18n="ball"></label><input class="inp" id="m-ball" name="m-ball" data-m="ball" inputmode="decimal" autocomplete="off" data-req data-num="6,16"></div>
            <div class="field"><label for="m-heel" data-i18n="heel"></label><input class="inp" id="m-heel" name="m-heel" data-m="heel" inputmode="decimal" autocomplete="off" data-req data-num="3,11"></div>
          </div>
          <div class="field"><label for="m-girth" data-i18n-html="girth"></label><input class="inp" id="m-girth" name="m-girth" data-m="girth" inputmode="decimal" autocomplete="off" data-num="15,36"></div>
          <div class="field"><label for="m-instep" data-i18n-html="instep"></label><input class="inp" id="m-instep" name="m-instep" data-m="instep" inputmode="decimal" autocomplete="off" data-num="15,36"></div>
        </div>
        <p class="fmsg" id="mMsg" role="alert" hidden></p>
        <button class="btn next" type="submit" data-i18n="nextTest"></button>
      </form>
    </div>
  </div>
</section>

<!-- ===== 4. ШАГ 2 — ТЕСТ СТЕЛЬКИ ===== -->
<section id="test" class="alt">
  <div class="wrap">
    <div class="stepno rv" data-step="2"><b></b><span class="bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i><i></i></span></div>
    <p class="kicker rv" data-i18n="tK"></p>
    <h2 class="rv" data-i18n="tH"></h2>
    <p class="lead rv" data-i18n="tLead"></p>
    <div class="test-grid">
      <div class="rv">
        <svg class="tsvg" id="tsvg" viewBox="0 0 200 430" role="img" aria-labelledby="tsvgT">
          <title id="tsvgT" data-i18n="tAlt"></title>
          <use href="#insoleP" class="ins"/>
          <g class="footA"><use href="#footG" class="ft"/></g>
          <g mask="url(#outM)"><g class="footA"><use href="#footG" class="over"/></g></g>
        </svg>
        <p class="tkey"><span><i style="background:var(--sand2)"></i><span data-i18n="tKeyIns"></span></span><span><i style="background:var(--hot)"></i><span data-i18n="tKeyOver"></span></span></p>
      </div>
      <div class="card rv">
        <ol class="nsteps" data-list="tSteps"></ol>
        <form id="testForm" novalidate>
          <div class="g2">
            <div class="field"><label for="tFoot" data-i18n="tFoot"></label><input class="inp" id="tFoot" inputmode="decimal" autocomplete="off" placeholder="10,5"></div>
            <div class="field"><label for="tIns" data-i18n="tInsole"></label><input class="inp" id="tIns" inputmode="decimal" autocomplete="off" placeholder="9,5"></div>
          </div>
          <p class="err" id="tErr" role="alert" style="margin-top:10px" hidden></p>
          <button class="btn" type="submit" style="width:100%;margin-top:16px" data-i18n="tBtn"></button>
          <a class="tlink" href="#quiz" data-i18n="tSkip"></a>
        </form>
        <div class="res" id="tRes" aria-live="polite" hidden></div>
      </div>
    </div>
    <p class="hint rv" data-i18n="tHint"></p>
  </div>
</section>

<!-- ===== 5. ШАГ 3 — КВИЗ «ТИП СТОПЫ» + КАРТИНКА ДЛЯ СТОРИС ===== -->
<section id="quiz">
  <div class="wrap narrow">
    <div class="stepno rv" data-step="3"><b></b><span class="bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span></div>
    <p class="kicker rv" data-i18n="qK"></p>
    <h2 class="rv" data-i18n="qH"></h2>
    <p class="lead rv" data-i18n="qLead"></p>
    <div class="card rv" id="quizBox" style="margin-top:28px"></div>
    <div class="card storybox" id="story" hidden>
      <canvas id="storyCv" width="1080" height="1920" hidden></canvas>
      <img id="storyImg" alt="" width="1080" height="1920">
      <div>
        <h3 data-i18n="sH"></h3>
        <p data-i18n="sLead"></p>
        <div class="btns">
          <button class="btn ghost" type="button" id="sShare" data-i18n="sShare"></button>
        </div>
        <p class="muted small" style="margin-top:14px" data-i18n="sHold"></p>
      </div>
    </div>
    <div class="btns" id="quizNext" hidden><a class="btn next" href="#join" data-i18n="nextForm"></a></div>
  </div>
</section>

<!-- ===== 6. ШАГ 4 — АНКЕТА «ПЕРВАЯ ТЫСЯЧА» ===== -->
<section id="join" class="alt">
  <div class="wrap narrow">
    <div class="stepno rv" data-step="4"><b></b><span class="bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span></div>
    <p class="kicker rv" data-i18n="fK"></p>
    <h2 class="rv" data-i18n="fH"></h2>
    <p class="lead rv" data-i18n="fLead"></p>
    <div class="card" style="margin-top:28px">
      <form class="form" id="joinForm" novalidate>
        <fieldset style="margin-top:0;padding-top:0;border:0">
          <legend data-i18n="g1"></legend>
          <div class="stack">
            <div class="field"><label for="f-name" data-i18n="name"></label><input class="inp" id="f-name" name="name" autocomplete="given-name" maxlength="60" data-req></div>
            <div class="field"><label for="f-wa" data-i18n="wa"></label><input class="inp" id="f-wa" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" data-req data-phone></div>
            <div class="field"><label for="f-ig" data-i18n-html="ig"></label><input class="inp" id="f-ig" name="instagram" autocapitalize="none" autocomplete="off" maxlength="60" placeholder="@"></div>
            <div class="field"><label for="f-city" data-i18n="city"></label><input class="inp" id="f-city" name="city" autocomplete="address-level2" maxlength="60" data-req></div>
            <div class="field" role="radiogroup" aria-labelledby="l-gender" data-reqgroup="gender"><span class="flabel" id="l-gender" data-i18n="gender"></span><div class="chips" data-chips="gender" data-type="radio"></div></div>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="g2"></legend>
          <div class="stack">
            <div class="g2">
              <div class="field"><label for="f-lenL" data-i18n="lenL"></label><input class="inp" id="f-lenL" name="lenL" inputmode="decimal" autocomplete="off" data-req data-num="15,35"></div>
              <div class="field"><label for="f-lenR" data-i18n="lenR"></label><input class="inp" id="f-lenR" name="lenR" inputmode="decimal" autocomplete="off" data-req data-num="15,35"></div>
            </div>
            <div class="g2">
              <div class="field"><label for="f-ball" data-i18n="ball"></label><input class="inp" id="f-ball" name="ball" inputmode="decimal" autocomplete="off" data-req data-num="6,16"></div>
              <div class="field"><label for="f-heel" data-i18n="heel"></label><input class="inp" id="f-heel" name="heel" inputmode="decimal" autocomplete="off" data-req data-num="3,11"></div>
            </div>
            <div class="field"><label for="f-girth" data-i18n-html="girth"></label><input class="inp" id="f-girth" name="girth" inputmode="decimal" autocomplete="off" data-num="15,36"></div>
            <div class="field"><label for="f-instep" data-i18n-html="instep"></label><input class="inp" id="f-instep" name="instep" inputmode="decimal" autocomplete="off" data-num="15,36"></div>
            <div class="field"><label for="f-insole" data-i18n-html="insole"></label><input class="inp" id="f-insole" name="insole" inputmode="decimal" autocomplete="off" data-num="5,14"></div>
            <div class="g2 g2w" style="grid-template-columns:1fr">
              <div class="field"><label for="f-jis" data-i18n-html="jis"></label><input class="inp" id="f-jis" name="jis" readonly placeholder="—"></div>
              <div class="field"><label for="f-type" data-i18n="type"></label><input class="inp" id="f-type" name="type" readonly data-i18n-ph="typePh"><input type="hidden" name="typeKeys" id="f-typeKeys"></div>
            </div>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="g3"></legend>
          <div class="stack">
            <div class="field" role="group" aria-labelledby="l-pains"><span class="flabel" id="l-pains"><span data-i18n="pains"></span> <small data-i18n="painsHint"></small></span><div class="chips" data-chips="pains" data-type="checkbox"></div></div>
            <div class="field"><label for="f-brands" data-i18n="brands"></label><textarea class="inp" id="f-brands" name="brands" maxlength="600" data-i18n-ph="brandsPh"></textarea></div>
          </div>
        </fieldset>
        <fieldset>
          <legend data-i18n="g4"></legend>
          <div class="stack">
            <div class="field" role="radiogroup" aria-labelledby="l-model"><span class="flabel" id="l-model" data-i18n="model"></span><div class="chips" data-chips="model" data-type="radio"></div></div>
            <div class="field" role="radiogroup" aria-labelledby="l-color"><span class="flabel" id="l-color" data-i18n="color"></span><div class="chips" data-chips="color" data-type="radio"></div></div>
          </div>
        </fieldset>
        <div class="field" id="consentField">
          <label class="consent"><input type="checkbox" name="consent" id="f-consent"><span><span data-i18n="consent"></span> <button type="button" class="linkbtn" style="padding:0;font-size:inherit" data-open="policy" data-i18n="policyLink"></button></span></label>
        </div>
        <button class="btn" type="submit" id="submitBtn" data-i18n="submit"></button>
        <p class="fmsg" id="formMsg" role="alert" hidden></p>
        <a class="btn ghost" id="waSend" target="_blank" rel="noopener" hidden data-i18n="waSend"></a>
      </form>
      <div class="okbox" id="okBox" tabindex="-1" hidden>
        <svg viewBox="0 0 84 84" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="42" cy="42" r="38"/><path d="M26 43l11 11 21-23"/></svg>
        <h3 data-i18n="okH"></h3>
        <p class="lead" style="margin:0 auto" data-i18n="okP"></p>
        <button class="btn" type="button" id="inviteBtn" data-i18n="okBtn"></button>
        <p class="demo" id="demoNote" hidden data-i18n="demo"></p>
      </div>
    </div>
  </div>
</section>

<!-- ===== 7. ИСТОРИЯ ОСНОВАТЕЛЯ ===== -->
<section id="founder">
  <div class="wrap">
    <p class="kicker rv" data-i18n="foK"></p>
    <h2 class="rv" data-i18n="foH"></h2>
    <div class="fgrid">
      <!-- ФОТО: когда будет снимок, замени весь блок <div class="photo">…</div> на
           <img src="founder.jpg" alt="Елжан и Елтинжал, основатели WYDE" style="border-radius:22px;width:100%"> -->

        <div class="photo"><svg viewBox="0 0 576 100" aria-hidden="true"><use href="#wyde"/></svg><span data-i18n="photo"></span></div>

      </figure>
      <div class="story rv">
        <div id="foText"></div>
        <p class="sign" data-i18n="sign"></p>
        <ul class="nums" id="nums"></ul>
      </div>
    </div>
  </div>
</section>

<!-- ===== 8. ДЛИНА ≠ ШИРИНА ≠ ОБЪЁМ + ПОЛНОТА JIS (считается из шага 1) ===== -->
<section id="size" class="alt">
  <div class="wrap">
    <p class="kicker rv" data-i18n="dK"></p>
    <h2 class="rv" data-i18n="dH"></h2>
    <p class="lead rv" data-i18n="dLead"></p>
    <div class="cols">
      <div class="rv">
        <div class="dia" aria-hidden="true">
          <svg viewBox="0 0 180 300">
            <use href="#footG" class="f" transform="translate(22 0) scale(.72)"/>
            <path class="d" d="M14 26V282M8 26H20M8 282H20M39 108H149M39 102V114M149 102V114M63 252H125M63 246V258M125 246V258"/>
            <g class="mk"><circle cx="14" cy="154" r="11"/><text x="14" y="158.5">1</text></g>
            <g class="mk"><circle cx="94" cy="108" r="11"/><text x="94" y="112.5">2</text></g>
            <g class="mk"><circle cx="94" cy="252" r="11"/><text x="94" y="256.5">3</text></g>
          </svg>
          <svg viewBox="0 0 260 170">
            <path class="gr" d="M8 142H252"/>
            <path class="f" d="M40 8V96C30 108 28 132 44 138H206C226 138 232 120 216 112C190 100 150 84 118 60C104 48 100 30 100 8"/>
            <ellipse class="d" cx="181" cy="116" rx="8" ry="26" stroke-dasharray="5 5"/>
            <ellipse class="d" cx="130" cy="104" rx="9" ry="34" stroke-dasharray="5 5" transform="rotate(-14 130 104)"/>
            <g class="mk"><circle cx="181" cy="72" r="11"/><text x="181" y="76.5">4</text></g>
            <g class="mk"><circle cx="126" cy="50" r="11"/><text x="126" y="54.5">5</text></g>

const QK = [["narrow", "regular", "wide"], ["low", "mid", "high"], ["big", "second", "square"], ["yes", "no"]];

  const body = `M${c} 34C${r(c + F * .8)} 30 ${c + F} 42 ${c + F} 60C${c + F} 82 ${c + H} 90 ${c + H} 114${heel}C${c - H} 90 ${c - F} 82 ${c - F} 60C${c - F} 42 ${r(c - F * .8)} 30 ${c} 34Z`;
  const rx = [9, 6.5, 6, 5.5, 5], ry = [11, 8.5, 8, 7, 6.5], xs = [24, 40, 53, 65, 76];
  const toes = tz.map((y, i) => `<ellipse class="${o.hl === "toes" ? "h" : "a"}" cx="${xs[i]}" cy="${y}" rx="${rx[i]}" ry="${ry[i]}"/>`).join("");
  return `<svg class="qi" viewBox="0 0 100 150" aria-hidden="true"><path class="${o.hl === "body" ? "h" : "a"}" d="${body}"/>${o.hl === "heel" ? `<path class="h" d="M${c + H} 104V114${heel}V104Z"/>` : ""}${toes}</svg>`;
}
function qIcon(qi, oi) {

    return `<svg class="qi" viewBox="0 0 120 90" aria-hidden="true"><path class="g" d="M6 81H114"/><path class="a" d="M16 6V56C10 64 10 76 20 78Q54 ${c[1]} 84 78H106C114 78 116 68 106 64C${c[0]} 46 20V6Z"/><path class="l" d="M106 64C${c[0]} 46 20"/></svg>`;
  }
  if (qi === 0) return topIcon({ H: [13, 20, 29][oi], hl: "heel" });
  if (qi === 2) return topIcon({ toes: [[24, 23, 25, 28, 32], [26, 19, 24, 28, 32], [24, 21.5, 21, 27, 32]][oi], hl: "toes" });

}

/* ---------- 5. Картинка для сторис (canvas 1080×1920) ---------- */
const pageUrl = () => location.origin + location.pathname;
let storyRun = 0;
async function drawStory() {
  const cv = $("#storyCv");
  if (!cv || !state.typeKeys.length) return;
  const run = ++storyRun, names = state.typeKeys.map(k => L.types[k].n.toUpperCase());
  const wider = state.test && state.test.diff > 0 ? fill(L.cWider, { x: state.test.diff }).toUpperCase() : "";
  const sample = names.join("") + L.cMy + L.cAsk + L.cTag + wider;
  try { await Promise.all([document.fonts.load("700 100px Oswald", sample.toUpperCase()), document.fonts.load("800 40px Manrope", sample)]); } catch (e) {}
  if (run !== storyRun) return;
  const c = cv.getContext("2d"), W = 1080, H = 1920, FH = 'Oswald,"Arial Narrow",Impact,sans-serif', FB = "Manrope,system-ui,sans-serif";
  const SAND = "#e8dcc6", HOT = "#ff4f1a", MUTE = "#a0957f";
  const fit = (txt, w, size, fam, max) => { for (; size > 30; size -= 4) { c.font = `${w} ${size}px ${fam}`; if (c.measureText(txt).width <= max) break; } return size; };
  const sp = px => { if ("letterSpacing" in c) c.letterSpacing = px + "px"; };
  c.setTransform(1, 0, 0, 1, 0, 0); c.textAlign = "left"; c.textBaseline = "alphabetic"; sp(0);
  c.fillStyle = "#0d0c0a"; c.fillRect(0, 0, W, H);
  const g = c.createRadialGradient(940, 180, 0, 940, 180, 1000);
  g.addColorStop(0, "rgba(255,79,26,.30)"); g.addColorStop(1, "rgba(255,79,26,0)");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  /* фоновый силуэт стопы */
  c.save(); c.translate(470, 380); c.rotate(.24); c.scale(3.7, 3.7); c.strokeStyle = "rgba(232,220,198,.12)"; c.lineWidth = 1;
  $$("#footG path").forEach(p => c.stroke(new Path2D(p.getAttribute("d"))));
  $$("#footG ellipse").forEach(el => { const a = n => +el.getAttribute(n); c.beginPath(); c.ellipse(a("cx"), a("cy"), a("rx"), a("ry"), 0, 0, 7); c.stroke(); });
  c.restore();
  /* логотип */
  c.save(); c.translate(90, 250); c.scale(.8, .8); c.transform(1, 0, -.158, 1, 0, 0); c.translate(16, 0); c.fillStyle = SAND;
  $$("#wyde path").forEach(p => { c.save(); c.translate(+p.dataset.x, 0); c.fill(new Path2D(p.getAttribute("d")), "evenodd"); c.restore(); });
  c.restore();
  /* подпись */
  c.fillStyle = HOT; c.fillRect(90, 452, 56, 7);
  c.font = `800 42px ${FB}`; sp(7); c.fillText(L.cMy.toUpperCase(), 168, 470); sp(0);
  /* имена типов */
  let size = [300, 260, 205][names.length - 1] || 190;
  names.forEach(n => { size = Math.min(size, fit(n, 700, size, FH, 900)); });
  c.font = `700 ${size}px ${FH}`; c.fillStyle = HOT;
  let y = 520;
  names.forEach(n => { y += size; c.fillText(n, 86, y - size * .12); });
  /* стрелка ширины */
  y += 50; c.fillStyle = SAND; c.fillRect(118, y - 3, 844, 6);
  [[90, 1], [990, -1]].forEach(([x, d]) => { c.beginPath(); c.moveTo(x, y); c.lineTo(x + 34 * d, y - 17); c.lineTo(x + 34 * d, y + 17); c.closePath(); c.fill(); });
  if (wider) { const s = fit(wider, 700, 92, FH, 900); c.font = `700 ${s}px ${FH}`; c.fillStyle = SAND; c.fillText(wider, 88, y + 60 + s * .8); }
  /* низ */
  const ask = L.cAsk.toUpperCase(), s2 = fit(ask, 700, 104, FH, 900);
  c.font = `700 ${s2}px ${FH}`; c.fillStyle = SAND; c.fillText(ask, 88, 1520);
  c.font = `600 40px ${FB}`; c.fillStyle = MUTE; c.fillText(L.cTag, 90, 1590);
  const host = (location.host + location.pathname).replace(/\/(index\.html)?$/, "");
  if (location.host) { c.font = `800 38px ${FB}`; c.fillStyle = HOT; c.fillText(host, 90, 1652); }
  /* PNG готовим заранее: «Поделиться» должно сработать сразу по нажатию (требование iOS),
     а саму картинку можно сохранить долгим нажатием — это выручает во встроенных браузерах Instagram и TikTok */
  cv.toBlob(b => {
    if (!b || run !== storyRun) return;
    storyPng = b; const img = $("#storyImg"), old = img.dataset.u;
    img.dataset.u = img.src = URL.createObjectURL(b); img.alt = L.cMy + ": " + typeName();
    if (old) setTimeout(() => URL.revokeObjectURL(old), 1000);
  }, "image/png");
}
let storyPng = null;
function storyDownload() {
  if (!storyPng) return;
  const a = document.createElement("a"), u = URL.createObjectURL(storyPng); a.href = u; a.download = "wyde-story.png";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 5000); track("StoryDownload");
}
function storyShare() {
  try {
    const file = new File([storyPng], "wyde-story.png", { type: "image/png" });
    if (storyPng && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], text: fill(L.shareText, { type: typeName() }) + " " + pageUrl() })
        .then(() => track("StoryShare"), e => { if (!e || e.name !== "AbortError") storyDownload(); });
      return;
    }
  } catch (e) {}
  storyDownload();
}

/* ---------- 6. Калькулятор полноты JIS (мужская таблица) ---------- */
const JIS = ["A", "B", "C", "D", "E", "2E", "3E", "4E", "F", "G"];
const jisLabel = idx => JIS[Math.max(0, Math.min(9, idx))] + (idx > 9 ? "+" : idx < 0 ? "−" : "");
/* полнота считается автоматически: длина — по большей стопе, обхват в пучках — из шага 1 */
function calcJis() {
  const v = n => num(($(`#joinForm [name="${n}"]`) || {}).value || "");
  const len = Math.max(v("lenL") || 0, v("lenR") || 0), g = v("girth");
  if (!(len >= 20 && len <= 32 && g >= 18 && g <= 33)) return null;
  const d = 222 + 0.6 * (len * 10 - 225);                   // обхват для полноты D, мм
  return { len, g, idx: 3 + Math.round((g * 10 - d) / 6) }; // шаг 6 мм; D — четвёртая буква
}
function renderJis() {
  const j = calcJis(), box = $("#jRes"), i = j ? Math.max(0, Math.min(9, j.idx)) : -1, fj = $("#f-jis");
  if (fj) fj.value = j ? jisLabel(j.idx) : "";
  $("#jScale").innerHTML = JIS.map((w, k) => `<span class="${k === i ? "on" : ""}">${w}</span>`).join("");
  box.innerHTML = !j ? `<p style="margin-top:16px">${esc(L.jNeed)}</p>` : `<p class="jis-out">${fill(L.jRes, { w: JIS[i] })}</p>`
    + (j.idx > 9 ? `<p style="margin-top:8px"><b>${esc(L.jOver)}</b></p>` : j.idx < 0 ? `<p style="margin-top:8px">${esc(L.jUnder)}</p>` : "")
    + `<p class="muted small" style="margin-top:10px">${esc(L.jNote)}</p><p class="note-ok">✓ ${esc(L.filled)}</p>`;
  box.hidden = false;
}

/* ---------- 8. Анкета: черновик, маска телефона, проверка, отправка ---------- */
const form = () => $("#joinForm");
let sent = false, draftT;
function formData() {
  const d = { pains: [] };
  $$("input[name],textarea[name]", form()).forEach(el => {
    if (el.name === "pains") { if (el.checked) d.pains.push(el.value); }
    else if (el.type === "checkbox") d[el.name] = el.checked;
    else if (el.type === "radio") { if (el.checked) d[el.name] = el.value; else if (!(el.name in d)) d[el.name] = ""; }
    else d[el.name] = el.value.trim();
  });
  return d;
}
function saveDraft() { clearTimeout(draftT); draftT = setTimeout(() => { if (!sent) store.set("wyde_draft", formData()); }, 300); }
function loadDraft() {
  const d = store.get("wyde_draft", null); if (!d) return;
  $$("input[name],textarea[name]", form()).forEach(el => {
    const v = d[el.name]; if (v == null || el.name === "consent") return;
    if (el.type === "checkbox") el.checked = Array.isArray(v) && v.includes(el.value);
    else if (el.type === "radio") el.checked = v === el.value;
    else el.value = v;
  });
}
/* если тест стельки уже пройден, а поле в анкете пустое — подставляем; затем раскладываем мерки по всем копиям */
function syncForm() {
  const put = (n, v) => { const el = $(`#joinForm [name="${n}"]`); if (el && !el.value) el.value = v; };
  if (state.test) { put("ball", fmt(state.test.foot)); put("insole", fmt(state.test.insole)); }
  Object.keys(MIRROR).forEach(n => { const el = $(`#joinForm [name="${n}"]`); if (el && el.value) mirrors(n).forEach(m => { if (m !== el) m.value = el.value; }); });
  renderJis();
}
function phoneDigits(v) { let d = v.replace(/\D/g, ""); if (v.trim().startsWith("+7")) d = d.slice(1); if (d.length > 10 && /^[78]/.test(d)) d = d.slice(1); return d.slice(0, 10); }
function phoneFmt(d) { let s = "+7"; if (d.length) s += " (" + d.slice(0, 3); if (d.length >= 3) s += ") " + d.slice(3, 6); if (d.length >= 6) s += "-" + d.slice(6, 8); if (d.length >= 8) s += "-" + d.slice(8, 10); return s; }
function phoneInput(e) {
  const el = e.target, del = (e.inputType || "").startsWith("delete"); let d = phoneDigits(el.value);
  if (del && d.length === (el._d || "").length) d = d.slice(0, -1);
  el._d = d; el.value = d.length ? phoneFmt(d) : del ? "" : "+7 (";
}
function setErr(field, msg) {
  field.classList.toggle("bad", !!msg);
  let e = $(".err", field); const inp = $(".inp", field);
  if (msg) {
    if (!e) { e = document.createElement("span"); e.className = "err"; e.id = "err-" + (inp ? inp.name : field.id || "g"); field.appendChild(e); }
    e.textContent = msg; if (inp) { inp.setAttribute("aria-invalid", "true"); inp.setAttribute("aria-describedby", e.id); }
  } else { if (e) e.remove(); if (inp) { inp.removeAttribute("aria-invalid"); inp.removeAttribute("aria-describedby"); } }
}
function checkField(el) {
  const v = el.value.trim(); let msg = "";
  if (el.hasAttribute("data-phone")) { if (phoneDigits(v).length !== 10) msg = L.ePhone; }
  else if (el.hasAttribute("data-req") && !v) msg = L.eReq;
  else if (el.dataset.num && v) { const [a, b] = el.dataset.num.split(",").map(Number), n = num(v); if (isNaN(n)) msg = L.eNum; else if (n < a || n > b) msg = L.eRange; }
  setErr(el.closest(".field"), msg); return !msg;
}
function validate() {
  let first = null;
  $$(".inp[data-req],.inp[data-num]", form()).forEach(el => { if (!checkField(el)) first = first || el; });
  const g = $("input[name=gender]:checked"); setErr($('[data-reqgroup="gender"]'), g ? "" : L.ePick); if (!g) first = first || $("input[name=gender]");
  const c = $("#f-consent"); setErr($("#consentField"), c.checked ? "" : L.eConsent); if (!c.checked) first = first || c;
  if (first) { first.focus({ preventScroll: true }); first.closest(".field").scrollIntoView({ behavior: "smooth", block: "center" }); }
  return !first;
}
/* В таблицу всё уходит по-русски, на каком бы языке ни заполняли — так проще анализировать */
function payload() {
  const d = formData(), lab = (k, v) => (v ? T.ru.opts[k][OPT[k].indexOf(v)] : "");
  const n = k => { const x = num(d[k]); return isNaN(x) ? "" : x; };
  const ball = n("ball"), ins = n("insole");
  return {
    name: d.name, whatsapp: "+7" + phoneDigits(d.whatsapp), instagram: d.instagram === "@" ? "" : d.instagram, city: d.city, gender: lab("gender", d.gender),
    lenL: n("lenL"), lenR: n("lenR"), ball, heel: n("heel"), girth: n("girth"), instep: n("instep"), insole: ins,
    widerMm: ball !== "" && ins !== "" ? Math.round((ball - ins) * 10) : "",
    jis: d.jis, type: state.typeKeys.length ? typeName("ru") : "",
    pains: d.pains.map(v => lab("pains", v)).join(", "), brands: d.brands, model: lab("model", d.model), color: lab("color", d.color),
    lang: state.lang.toUpperCase(), consent: "да",
    utm: new URLSearchParams(location.search).get("utm_source") || document.referrer || ""
  };
}
const WA_LABELS = { name: "Имя", whatsapp: "WhatsApp", instagram: "Instagram", city: "Город", gender: "Пол", lenL: "Длина левой, см", lenR: "Длина правой, см", ball: "Ширина в пучках, см", heel: "Ширина пятки, см", girth: "Обхват в пучках, см", instep: "Обхват в подъёме, см", insole: "Ширина стельки, см", widerMm: "Стопа шире стельки, мм", jis: "Полнота JIS", type: "Тип стопы", pains: "Где проигрывает обувь", brands: "Бренды и ширины", model: "Модель", color: "Цвет", lang: "Язык", consent: "Согласие на обработку данных" };
const waNum = () => CONFIG.whatsapp.replace(/\D/g, "");
const waLink = d => "https://wa.me/" + waNum() + "?text=" + encodeURIComponent("Анкета WYDE — первая тысяча\n" + Object.keys(WA_LABELS).filter(k => d[k] !== "" && d[k] != null).map(k => WA_LABELS[k] + ": " + d[k]).join("\n"));
function done(demo) {
  sent = true; store.del("wyde_draft");
  form().hidden = true; const ok = $("#okBox"); ok.hidden = false; $("#demoNote").hidden = !demo;
  ok.focus({ preventScroll: true }); $("#join").scrollIntoView({ behavior: "smooth" });
  try { if (window.fbq) fbq("track", "Lead"); if (window.ttq) ttq.track("SubmitForm"); } catch (e) {}
}
async function submitForm(e) {
  e.preventDefault();
  const msg = $("#formMsg"), btn = $("#submitBtn"), wa = $("#waSend");
  msg.hidden = true; wa.hidden = true;
  if (!validate()) { msg.textContent = L.eSum; msg.hidden = false; return; }
  const data = payload();
  if (!CONFIG.sheetUrl) {                                   // ДЕМО-РЕЖИМ: сохраняем на устройстве
    const all = store.get("wyde_submissions", []); all.push({ ...data, date: new Date().toISOString() }); store.set("wyde_submissions", all);
    return done(true);
  }
  btn.disabled = true; btn.textContent = L.sending;
  try {
    const r = await fetch(CONFIG.sheetUrl, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(data) });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || "sheet error");
    done(false);
  } catch (err) {
    msg.textContent = L.fail; msg.hidden = false;
    if (CONFIG.whatsapp) { wa.href = waLink(data); wa.hidden = false; }
  } finally { btn.disabled = false; btn.textContent = L.submit; }
}
async function invite() {
  const url = pageUrl(), text = L.invite;
  try { if (navigator.share) { await navigator.share({ title: "WYDE", text, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text + " " + url); toast(L.copied); }
  catch (e) { window.open("https://wa.me/?text=" + encodeURIComponent(text + " " + url), "_blank", "noopener"); }
}

/* ---------- Контакты и пиксели: появляются только если заполнен CONFIG ---------- */

};
function initContacts() {
  const url = (v, base) => (!v ? "" : /^https?:\/\//.test(v) ? v : base + v.replace(/^@/, ""));
  const links = [
    ["Instagram", "instagram", url(CONFIG.instagram, "https://instagram.com/")],
    ["TikTok", "tiktok", url(CONFIG.tiktok, "https://www.tiktok.com/@")],
    ["Threads", "threads", url(CONFIG.threads, "https://www.threads.net/@")],
    ["WhatsApp", "whatsapp", CONFIG.whatsapp ? "https://wa.me/" + waNum() : ""]
  ].filter(x => x[2]);
  const box = $("#soc");

  box.hidden = !links.length;
  if (CONFIG.whatsapp) { const wa = $("#waFloat"); wa.href = "https://wa.me/" + waNum(); wa.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${SOC.whatsapp}</svg>`; wa.hidden = false; }
}
function initPixels() {
  if (CONFIG.metaPixelId) {
    !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");

/* ---------- Запуск ---------- */
function init() {
  state.test = store.get("wyde_test", null);
  const qa = store.get("wyde_quiz", null);
  if (Array.isArray(qa) && qa.length === 4) { state.quiz.a = qa; computeType(); }
  setLang(store.get("wyde_lang", "ru"));                    // по умолчанию RU
  loadDraft();
  const tk = $("#f-typeKeys").value;
  if (!state.typeKeys.length && tk) state.typeKeys = tk.split(",").filter(k => T.ru.types[k]);
  renderType(); syncForm();
  initContacts(); initPixels();

  $$(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang, true)));
  $("#testForm").addEventListener("submit", runTest);
  const mf = $("#mForm");
  mf.addEventListener("submit", measureNext);
  mf.addEventListener("input", e => { const el = e.target; if (!el.dataset.m) return; if (el.closest(".bad")) checkField(el); setMeasure(el.dataset.m, el.value, el); });
  ["#tFoot", "#tIns"].forEach(q => $(q).addEventListener("input", e => { $("#testForm .btn").hidden = false; setMeasure(q === "#tFoot" ? "ball" : "insole", e.target.value, e.target); }));
  $("#quizBox").addEventListener("click", quizClick);
  $("#sShare").addEventListener("click", storyShare);
  $("#inviteBtn").addEventListener("click", invite);
  $("#waSend").addEventListener("click", () => setTimeout(() => done(false), 900));

  const f = form(), ph = $("[data-phone]", f);
  f.addEventListener("submit", submitForm);
  f.addEventListener("input", e => { if (e.target === ph) phoneInput(e); if (e.target.closest(".bad") && e.target.classList.contains("inp")) checkField(e.target); if (e.target.name in MIRROR) setMeasure(e.target.name, e.target.value, e.target); saveDraft(); });
  f.addEventListener("change", e => { const fd = e.target.closest(".field.bad"); if (fd && !e.target.classList.contains("inp")) setErr(fd, ""); saveDraft(); });
  ph.addEventListener("focus", () => { if (!ph.value) ph.value = "+7 ("; });
  ph.addEventListener("blur", () => { if (!phoneDigits(ph.value)) ph.value = ""; });

  const dlg = $("#policy");
  $$('[data-open="policy"]').forEach(b => b.addEventListener("click", () => (dlg.showModal ? dlg.showModal() : dlg.setAttribute("open", ""))));
  dlg.addEventListener("click", e => { if (e.target === dlg || e.target.closest("[data-close]")) (dlg.close ? dlg.close() : dlg.removeAttribute("open")); });

  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { rootMargin: "0px 0px -6% 0px" });
    $$(".rv").forEach(el => io.observe(el));
  } else $$(".rv").forEach(el => el.classList.add("in"));
}
try { init(); } catch (err) { document.documentElement.classList.remove("js"); console.error(err); }
